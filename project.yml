name: Jumla
options:
  bundleIdPrefix: com.jumla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: جُمْلَة
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_LANGUAGE: ar
targets:
  Jumla:
    type: application
    platform: iOS
    sources:
      - path: Jumla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jumla.mvp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Jumla/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: جُمْلَة
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
